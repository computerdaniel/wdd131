<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Search for delicious recipes using RecipeBook.">
    <meta name="Daniel Scheibmeir" content="Daniel Scheibmeir">

    <title>RecipeBook</title>

    <!-- CSS -->
    <link rel="stylesheet" href="recipe.css">

    <!-- JavaScript -->
    <script src="recipe.js" defer></script>
</head>
<body>

    <main class="page">

        <!-- RECIPE BOOK LOGO -->
        <header class="logo">

            <svg viewBox="0 0 75 85" aria-label="RecipeBook logo">
                <path
                    d="M12 8 H57 Q62 8 62 14 V73 Q62 78 57 78 H12 Z"
                    fill="white"
                    stroke="black"
                    stroke-width="3"
                />

                <path
                    d="M7 8 V78 M12 8 V78"
                    fill="none"
                    stroke="black"
                    stroke-width="3"
                />

                <path
                    d="M27 34 Q20 26 25 22 Q31 18 36 25 Q42 17 48 23 Q53 29 46 34 V47 H29 V34 Z"
                    fill="white"
                    stroke="black"
                    stroke-width="3"
                />

                <path
                    d="M36 34 V47"
                    stroke="black"
                    stroke-width="3"
                />
            </svg>

            <h1>RecipeBook</h1>

        </header>


        <!-- SEARCH BAR -->
        <section class="search-area">

            <form id="search-form">

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search recipes..."
                    aria-label="Search recipes"
                >

                <button type="submit" aria-label="Search">

                    <svg viewBox="0 0 24 24">
                        <circle cx="10.5" cy="10.5" r="7.5"></circle>
                        <path d="M16 16 L22 22"></path>
                    </svg>

                </button>

            </form>

        </section>


        <!-- RECIPE RESULTS -->
        <section class="results-area">

            <div id="recipe-container">

                <!-- JavaScript inserts recipe cards here -->

            </div>

        </section>

        
        <footer>
            <a href="https://www.flaticon.com/" target="_blank">
                Recipe icons created by Freepik - Flaticon
            </a>

            <div class="social-icons">

                <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
                    <img src="imgs/instagram_icon.svg" alt="Instagram">
                </a>

                <a href="https://www.youtube.com/" target="_blank" aria-label="YouTube">
                    <img src="imgs/youtube_icon.svg" alt="YouTube">
                </a>

                <a href="https://www.pinterest.com/" target="_blank" aria-label="Pinterest">
                    <img src="imgs/pinterest_icon.svg" alt="Pinterest">
                </a>

            </div>
        </footer>


    </main>

</body>
</html>
