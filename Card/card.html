
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="WDD131 JavaScript Character Card featuring Snortleblat.">
    <meta name="author" content="Your Name">

    <!-- Social Media Meta Information -->
    <meta property="og:title" content="Character Card">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">
    <meta property="og:description" content="Meet Snortleblat, the Swamp Beast Diplomat!">

    <title>Character Card</title>

    <link rel="stylesheet" href="card.css">
    <script src="card.js" defer></script>
</head>

<body>

    <main>
        <section class="character-card">

            <img
                id="character-image"
                src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
                alt="Snortleblat, the Swamp Beast Diplomat"
            >

            <div class="character-name">
                <h1 id="name">Snortleblat</h1>
            </div>

            <div class="character-details">

                <p><strong>Class:</strong> <span id="class">Swamp Beast Diplomat</span></p>

                <p><strong>Level:</strong> <span id="level">1</span></p>

                <p><strong>Health:</strong> <span id="health">100</span></p>

                <div class="buttons">
                    <button id="attacked" type="button">Attacked</button>

                    <button id="level-up" type="button">Level Up</button>

                    <button id="reset" type="button">Reset</button>
                </div>

            </div>

        </section>
    </main>

</body>
</html>
