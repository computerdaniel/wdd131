
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for an event and receive your ticket.">
  <title>Rove - Event Ticket Form</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="index.html">rove<span>.</span></a>
  </header>

  <main>
    <section class="form-container">
      <h1>Event Ticket Form</h1>
      <p class="intro">Register for an upcoming event below.</p>

      <form id="event-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name"
            placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="date">Event Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" name="type" required>
            <option value="">Select a type</option>
            <option value="student">Student</option>
            <option value="guest">Guest</option>
          </select>
        </div>

        <div class="form-group hidden" id="extra-field">
          <label for="extra-input" id="extra-label">Student I#</label>
          <input type="text" id="extra-input" name="extra"
            autocomplete="off">
          <small id="extra-help"></small>
        </div>

        <button type="submit">Submit</button>
      </form>

      <div id="errors" class="errors" aria-live="polite" tabindex="-1"></div>

      <section id="ticket" class="ticket hidden"
        aria-live="polite">
        <h2>Ticket Confirmed!</h2>
        <p>Your registration was successful.</p>
        <div id="ticket-details"></div>
        <p class="ticket-footer">Thank you for registering!</p>
      </section>
    </section>
  </main>

  <footer>
    <p>Rove Events | WDD131</p>
  </footer>
</body>
</html>
